<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">

<style>
:root{--bg:#0f141a;--card:#17202a;--card2:#1e2834;--line:#2a3644;--tx:#e8edf2;--mut:#8fa0b3;--acc:#5eb1ef;
--run:#fc6b3f;--swim:#3fb5fc;--bike:#7bd88f;--gym:#b48cff;--race:#ffcc4d;--test:#ff8fb1;--rest:#6b7a8c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx)}
body{font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
header{padding:calc(env(safe-area-inset-top) + 14px) 16px 4px;max-width:760px;margin:0 auto}
h1{font-size:28px;margin:0;letter-spacing:-.02em;font-weight:800}
h2{font-size:18px;margin:0 0 8px}
h3{font-size:15px;margin:14px 0 6px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.sub{color:var(--mut);font-size:13px}
nav{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 12px;position:sticky;top:0;background:var(--bg);z-index:5;scrollbar-width:none;max-width:760px;margin:0 auto}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:1px solid var(--line);background:transparent;color:var(--tx);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
nav button.on{background:var(--acc);color:#06121d;border-color:var(--acc);font-weight:700}
main{padding:0 16px 48px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.big{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--card2);border-radius:12px;padding:10px}
.kpi b{display:block;font-size:20px}
.kpi span{color:var(--mut);font-size:12px}
.badge{display:inline-block;font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--mut)}
.badge.s{border-color:#d9a54a;color:#ffcf73}.badge.e{border-color:#3f8f5a;color:#8fe0a8}.badge.r{border-color:#6b7a8c;color:#c3cfdb}
.ses{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.ses:first-child{border-top:0}
.ses .sb{flex:1;min-width:0;border-left:3px solid var(--rest);padding-left:10px}
.ses.run .sb{border-color:var(--run)}.ses.swim .sb{border-color:var(--swim)}.ses.bike .sb{border-color:var(--bike)}
.ses.gym .sb{border-color:var(--gym)}.ses.race .sb{border-color:var(--race)}.ses.test .sb{border-color:var(--test)}.ses.multi .sb{border-color:var(--race)}
.sh{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mut)}
.tg{font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:11px}
.run .tg{color:var(--run)}.swim .tg{color:var(--swim)}.bike .tg{color:var(--bike)}.gym .tg{color:var(--gym)}.race .tg,.multi .tg{color:var(--race)}.test .tg{color:var(--test)}
.st{font-weight:700;margin:2px 0}
.sx{color:#c7d2dd;font-size:14px}
.ses.done .st,.ses.done .sx{opacity:.45;text-decoration:line-through}
.ck{position:relative;flex:none;width:26px;height:26px;margin-top:2px}
.ck input{position:absolute;opacity:0;width:26px;height:26px;margin:0;cursor:pointer}
.ck span{display:block;width:26px;height:26px;border-radius:8px;border:2px solid var(--line)}
.ck input:checked+span{background:var(--acc);border-color:var(--acc)}
.ck input:checked+span::after{content:"";position:absolute;left:9px;top:4px;width:6px;height:12px;border:solid #06121d;border-width:0 3px 3px 0;transform:rotate(45deg)}
.day{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:10px 0}
.day.today{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.dh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.dh b{font-size:16px}
.empty{color:var(--mut);font-size:14px;padding:6px 0}
.wnav{display:flex;align-items:center;gap:8px}
.btn{border:1px solid var(--line);background:var(--card2);color:var(--tx);border-radius:12px;padding:9px 13px;font:inherit;font-size:14px;cursor:pointer}
.btn.p{background:var(--acc);border-color:var(--acc);color:#06121d;font-weight:700}
.btn.sm{padding:5px 10px;font-size:13px}
select,input[type=text],input[type=password],input[type=number],input[type=date]{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:15px;max-width:100%}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.tot{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin-top:6px}
.tot b{color:var(--tx)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.wk{border:1px solid var(--line);border-radius:10px;padding:6px;font-size:12px;text-align:center;cursor:pointer;background:var(--card2)}
.wk.s{border-color:#d9a54a;background:#2b2414}
.wk b{display:block;font-size:13px}
.note{font-size:13px;color:var(--mut)}
.ev{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.evd{flex:none;width:58px;text-align:center;background:var(--card2);border-radius:12px;padding:6px 0}
.evd b{display:block;font-size:20px}
.evd span{font-size:11px;color:var(--mut);text-transform:uppercase}
.past{opacity:.5}
.wl{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.wl>span{font-size:13px;color:var(--mut)}
.segr{display:flex;gap:4px}
.sg{flex:1;border:1px solid var(--line);background:var(--card2);color:var(--tx);border-radius:10px;padding:8px 0;font:inherit;font-size:15px;cursor:pointer}
.sg.on{background:var(--acc);border-color:var(--acc);color:#06121d;font-weight:700}
.adv{border-radius:12px;padding:10px 12px;margin-top:12px;font-size:14px;border:1px solid var(--line)}
.adv.green{background:#14271b;border-color:#3f8f5a}.adv.orange{background:#2b2414;border-color:#d9a54a}.adv.red{background:#2c1717;border-color:#c25b5b}
.badge.green{border-color:#3f8f5a;color:#8fe0a8}.badge.orange{border-color:#d9a54a;color:#ffcf73}.badge.red{border-color:#c25b5b;color:#ff9b9b}
.fuel{background:#2a2412;border:1px solid #5c4a1c;border-radius:12px;padding:8px 10px;margin-top:10px;font-size:14px}
.fuel b{color:#ffcf73}
.spd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;background:var(--card2);border-radius:12px;padding:8px 10px}
.spd .sl{font-size:13px;color:var(--mut);flex-basis:100%}
.spd .pk{display:flex;align-items:center;gap:4px;flex:1}
.spd select{font-size:20px;font-weight:700;padding:6px 8px;font-variant-numeric:tabular-nums}
.spd.set{outline:1px solid #3f8f5a}
.spd.set .btn{color:#8fe0a8}
.lnk{background:none;border:0;color:var(--acc);font:inherit;font-size:13px;padding:8px 0 0;cursor:pointer}
.chw{position:relative}
.ax{fill:var(--mut);font-size:11px;font-variant-numeric:tabular-nums}
.tip{position:absolute;top:4px;width:150px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:13px;pointer-events:none}
details summary{cursor:pointer}
.month{margin:18px 0 6px;scroll-margin-top:70px}
.month h2{font-size:22px;margin:0 0 8px}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cgrid .wd{font-size:11px;color:var(--mut);text-align:center;padding:2px 0 6px}
.cday{min-height:52px;border-radius:10px;padding:4px 2px;text-align:center;cursor:pointer;border:1px solid transparent}
.cday.sc{background:#241f13}
.cday.race{border-color:var(--race);background:#2e2611}
.cday.past{opacity:.45}
.cday .n{font-size:15px;font-weight:600;display:inline-block;width:26px;height:26px;line-height:26px;border-radius:50%}
.cday.tdy .n{background:var(--acc);color:#06121d}
.cday.ok .n{color:var(--bike)}
.dots{display:flex;justify-content:center;flex-wrap:wrap;gap:2px;margin-top:2px}
.dots i{width:6px;height:6px;border-radius:50%;display:block}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut)}
.legend span{display:flex;align-items:center;gap:4px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
.rt{background:var(--card2);border-radius:12px;padding:10px 12px;margin-top:10px}
.rt b{font-size:14px}
.rt ul{margin:6px 0 0;padding-left:18px;font-size:14px;color:#c7d2dd}
.rt li{margin:3px 0}
#sheet{position:fixed;inset:0;z-index:20;display:none}
#sheet.on{display:block}
#sheet .bg{position:absolute;inset:0;background:rgba(0,0,0,.55)}
#sheet .pn{position:absolute;left:0;right:0;bottom:0;max-height:82vh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:14px 16px calc(24px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto;border-top:1px solid var(--line)}
.phase{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;color:#06121d}
a{color:var(--acc)}
</style>
</head>
<body>
<header>
  <h1>Cap Ironman 2028</h1>
  <div class="sub" id="hsub"></div>
</header>
<nav id="tabs">
  <button data-t="today">Aujourd'hui</button>
  <button data-t="cal">Calendrier</button>
  <button data-t="plan">Planning</button>
  <button data-t="prog">Progrès</button>
  <button data-t="goals">Objectifs</button>
  <button data-t="calc">Calcul nutri</button>
  <button data-t="races">Courses</button>
  <button data-t="zones">Allures</button>
  <button data-t="nutri">Nutrition</button>
  <button data-t="dday">Jour J</button>
  <button data-t="settings">Réglages</button>
</nav>
<main id="view"></main>
<div id="sheet"></div>

<script>
/* ============================================================
   Cap Ironman 2028 — plan jour par jour généré automatiquement
   Quentin · Mont-de-Marsan / Tarbes · ENIT S5APP → S8APP
   ============================================================ */

// ---------- Dates ----------
const DAY = 86400000;
function D(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12);}
function key(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function add(d,n){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+n,12);return x;}
function monday(d){return add(d,-((d.getDay()+6)%7));}
function diff(a,b){return Math.round((b-a)/DAY);}
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const dn=(t.getUTCDay()+6)%7;t.setUTCDate(t.getUTCDate()-dn+3);const y=t.getUTCFullYear();const j4=new Date(Date.UTC(y,0,4));const w=1+Math.round(((t-j4)/DAY-3+((j4.getUTCDay()+6)%7))/7);return [y,w];}
function wkKey(d){const [y,w]=isoWeek(d);return y+'-W'+String(w).padStart(2,'0');}
function today(){const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate(),12);}
const JOURS=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const MOIS=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
function fd(d,opt){opt=opt||{};return (opt.day?JOURS[(d.getDay()+6)%7]+' ':'')+d.getDate()+' '+MOIS[d.getMonth()]+(opt.year?' '+d.getFullYear():'');}
function hm(min){min=Math.round(min);if(min<60)return min+"'";const h=Math.floor(min/60),m=min%60;return h+'h'+(m?String(m).padStart(2,'0'):'');}
function hms(s){s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+'h'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0');}
function mss(s){s=Math.round(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function parseTime(s){if(!s)return NaN;const p=String(s).trim().replace(/h/i,':').split(':').map(Number);if(p.some(isNaN))return NaN;return p.length===3?p[0]*3600+p[1]*60+p[2]:p.length===2?p[0]*60+p[1]:p[0];}

const START=D('2026-10-20'), RACE=D('2028-06-18'), PLAN0=D('2026-10-19');

// ---------- Stockage ----------
const LS='capIronman2028';
function load(){try{return JSON.parse(localStorage.getItem(LS))||{};}catch(e){return {};}}
let ST=Object.assign({done:{},runTests:[],swimTests:[],ftp:null,fcmax:210,school:{},gym:null,ef:355,sprint:210,efV:45.6},load());
if(ST.v!==3&&ST.v!==4){ST.ef=355;ST.efV=45.6;ST.sprint=ST.sprint||210;ST.fcmax=ST.fcmax&&ST.fcmax!==198?ST.fcmax:210;ST.v=3;save();}
if(ST.v!==4){ST.weight=ST.weight||76;ST.height=ST.height||178;ST.log=ST.log||{};ST.v=4;save();}
function save(){try{localStorage.setItem(LS,JSON.stringify(ST));}catch(e){}}

// ---------- Calendrier ENIT ----------
// 2026-27 : S5APP / S6APP (calendrier officiel). 2027-28 : estimé d'après le modèle S7APP / S8APP du calendrier 2026-27.
const SCHOOL0={2026:[39,40,41,42,43,48,49,50,51],
 2027:[8,9,10,11,12,13,19,20,21,22,23,24,36,37,38,39,40,45,46,47,48,49],
 2028:[1,2,3,4,9,10,11,12,13,19,20,21,22,23,24]};
function isSchool(d){const k=wkKey(d);if(ST.school&&k in ST.school)return ST.school[k];const [y,w]=isoWeek(d);return (SCHOOL0[y]||[]).includes(w);}
const GYM0=['Pecs','Dos','Bras','Pecs','Dos','Bras','Repos'];

// ---------- Course à pied : modèle VDOT (Daniels) ----------
function vo2(v){return -4.6+0.182258*v+0.000104*v*v;}
function pctMax(t){return 0.8+0.1894393*Math.exp(-0.012778*t)+0.2989558*Math.exp(-0.1932605*t);}
function vdotOf(dist,sec){const t=sec/60;return vo2(dist/t)/pctMax(t);}
function velAt(o){const a=0.000104,b=0.182258,c=-(4.6+o);return (-b+Math.sqrt(b*b-4*a*c))/(2*a);}
function raceSec(v,dist){let lo=dist/1000*120,hi=dist/1000*720;for(let i=0;i<60;i++){const m=(lo+hi)/2;const vd=vo2(dist/(m/60))/pctMax(m/60);if(vd>v)lo=m;else hi=m;}return (lo+hi)/2;}
function secKm(vel){return 60000/vel;}
function Emid(v){return secKm(velAt(.675*v));}
// Allures perso : ton EF réelle (6:00 en aisance) et ta vitesse pure (30 s à 3:30) recalent le modèle
function myPaces(v){const p=paces(v),ef=ST.ef||360,sp=ST.sprint||210,a=ST.efV||36.6;
 const r=1-0.5*(1-Emid(v)/Emid(a)),e=ef*r;p.E=[Math.max(e-5,p.M+20),e+15];
 p.R=Math.min(p.R,sp*1.2*r);p.V=Math.min(secKm(velAt(v)),p.R+18);return p;}
function paces(v){const M=raceSec(v,42195)/42.195;return{
 E:[secKm(velAt(.72*v)),secKm(velAt(.63*v))],M,S:raceSec(v,21097.5)/21.0975,K10:raceSec(v,10000)/10,
 T:secKm(velAt(.88*v)),I:secKm(velAt(.975*v)),R:secKm(velAt(1.06*v)),IM:M+55};}
const BASE_RUNS=[{d:'2026-10-11',dist:21110,sec:7072,label:'Semi des Landes (11 oct. 2026)'},{d:'2026-10-20',dist:10000,sec:3240,label:'10 km en 54:00'},{d:'2026-10-20',thr:275,label:'Seuil Garmin 4:35/km'}];
function vdotThr(sec){return vo2(1000/(sec/60))/0.88;}
// Progression prévue (VDOT) à partir du seuil 4:35 : semi 1h40 (7 fév. 27) → 10 km 44:00 (7 mars 27) → 10 km 43:30 (juil. 27) → semi 1h36 (sept. 27) → marathon 3h25 (oct. 27) → semi 1h34 (fév. 28) → 10 km 42:30 (mars 28)
const VDOT_PLAN=[['2026-10-20',45.6],['2027-02-07',46.2],['2027-03-07',46.5],['2027-07-11',47],['2027-09-19',47.4],['2027-10-10',47.5],['2028-02-20',48.2],['2028-03-12',48.4],['2028-06-18',48.8]];
function interp(pts,d){const t=d.getTime();if(t<=D(pts[0][0]).getTime())return pts[0][1];for(let i=1;i<pts.length;i++){const a=D(pts[i-1][0]).getTime(),b=D(pts[i][0]).getTime();if(t<=b)return pts[i-1][1]+(pts[i][1]-pts[i-1][1])*(t-a)/(b-a);}return pts[pts.length-1][1];}
function runTests(){return BASE_RUNS.concat(ST.runTests||[],logTests()).map(r=>Object.assign({v:r.thr?vdotThr(r.thr):vdotOf(r.dist,r.sec)},r)).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);}
function measuredVdot(){const t=runTests();return t[t.length-1].v;}
function sessionVdot(d){
 // VDOT implicite des séances de qualité réalisées (6 dernières semaines), via le rapport allure prévue / réalisée
 const k=key(d),lo=key(add(d,-42)),v=[];
 Object.values(ST.log||{}).forEach(l=>{if(l.sp!=='run'||!(l.k==='seuil'||l.k==='vma')||!l.vd||!l.plan||!l.val||l.d>=k||l.d<lo)return;
  const r=l.plan/l.val;if(r<0.8||r>1.25)return;v.push(l.vd*r);});
 if(v.length<3)return null;v.sort((a,b)=>a-b);return v[Math.floor(v.length/2)];}
function baseVdot(d){return Math.min(interp(VDOT_PLAN,d),measuredVdot()+1);}
function usedVdot(d){const b=baseVdot(d),sv=sessionVdot(d);if(sv==null)return b;
 if(sv>b+0.3)return Math.min(sv-0.2,b+1.5);if(sv<b-0.5)return Math.max(sv+0.2,b-1.5);return b;}

// ---------- Natation : CSS ----------
const BASE_SWIM={d:'2026-10-20',css:112,label:'Estimation à partir de Strava'};
const CSS_PLAN=[['2026-10-19',112],['2027-05-16',107],['2027-09-30',105],['2028-03-01',103],['2028-06-18',102]];
function swimTests(){return [BASE_SWIM].concat(ST.swimTests||[]).sort((a,b)=>a.d<b.d?-1:1);}
function measuredCss(){const t=swimTests();return t[t.length-1].css;}
function usedCss(d){return Math.max(interp(CSS_PLAN,d),measuredCss()-2);}

// ---------- Tokens dans les descriptions ----------
let CTX={};
function ctx(d){const k=key(d);if(!CTX[k]){const v=usedVdot(d);CTX[k]={v,p:myPaces(v),c:usedCss(d)};}return CTX[k];}
function zone(lo,hi,name,rpe){const f=ST.ftp;return `${name} (${lo}-${hi} % FTP${f?' · '+Math.round(lo/100*f)+'-'+Math.round(hi/100*f)+' W':''}, RPE ${rpe})`;}
function fill(x,d){if(!x)return '';const {p,c}=ctx(d);
 const sp=interp([['2026-10-20',24],['2027-06-01',27],['2028-06-18',30]],d);
 return esc(x).replace(/\{lt(\d+)\}/g,(m,k)=>hm(k*((p.E[0]+p.E[1])/2)/60)).replace(/\{bk(\d+)\}/g,(m,mn)=>Math.round(mn/60*sp/5)*5).replace(/\{km(\d+)\}/g,(m,mn)=>(Math.round(mn*60/((p.E[0]+p.E[1])/2)*10)/10).toString().replace('.',','))
 .replace(/\{(\w+)\}/g,(m,t)=>{switch(t){
  case 'E':return `<b>${mss(p.E[0])}–${mss(p.E[1])}/km</b>`;

// ---------- Fabriques de séances ----------
function run(t,min,x,q){return {sp:'run',t,min:Math.round(min),x,q:!!q};}
function EF(min,extra){min=Math.round(min);return run('Endurance fondamentale',min,`${min}' en aisance à {E}${extra||''}. Tu dois pouvoir parler.`);}
function longRun(min,extra){const s=run('Sortie longue',min,'',1);s.lx=extra||'';return s;}
function longRunKm(km,extra){const s=run('Sortie longue',km*6,`${km} km à {E} (≈ {lt${km}})${extra||''}. Pars 15 s/km plus lent les 3 premiers km. Eau + 1 gel toutes les 40'.`,1);s.km=km;return s;}
// distance de la sortie longue du samedi : 20 km minimum
const LRKM={fond:[20,22],v10:[22,24],semi:[21,24],ete:[20,22],trans:[20,20],hiver:[20,24]};
function kmFor(ph,k,n,rec){
 if(ph.k==='build')return [20,22,24,20,25,26,20,0,20,22,28][k];
 if(ph.k==='taper')return [22,20,0][k];
 if(ph.k==='trans'&&k===0)return 0;
 if(rec)return 20;
 const a=LRKM[ph.k];if(!a)return 20;const t=n>1?k/(n-1):1;return Math.round(a[0]+(a[1]-a[0])*t);}
function brick(min){return run('Enchaînement (brick)',min,`Dès la descente du vélo : ${min}' à {IM}, les 5 dernières minutes vers {M}. Transition rapide, foulée courte.`);}
function swimS(kind,m){
 m=Math.max(1000,Math.round(m/100)*100);const body=m-900;let t,x;
 const wu="Échauf. 400 (200 crawl, 100 dos, 100 brasse) · éducatifs 6×50 r15 s (rattrapé, poings fermés, respiration 3-5-7 temps)";
 switch(kind){
  case 'tech':t='Natation technique';x=`${wu} · Corps ${body} m : ${Math.round(body/100)}×100 à {CSSe} r15 s, focus allonge et respiration tous les 3 temps · 200 souple.`;break;
  case 'css':{const r=Math.max(4,Math.floor(body/200));t='Natation CSS (seuil)';x=`${wu} · Corps : ${r}×200 à {CSS} r20 s, régularité ±2 s · le reste en souple · 200 souple.`;break;}
  case 'end':{const b=Math.max(2,Math.round(body/500));t='Natation endurance';x=`${wu} · Corps : ${b}×${Math.round(body/b/50)*50} m à {CSSe} r30 s (pull-buoy un bloc sur deux) · 200 souple.`;break;}
  case 'vit':t='Natation vitesse';x=`${wu} · 12×50 à {CSSv} r20 s · ${Math.max(200,body-600)} m à {CSSe} · 200 souple.`;break;
  case 'im':t='Natation allure Ironman';x=`${wu} · Corps ${body} m en continu (ou 2 blocs) à {CSSim}, lever la tête pour viser toutes les 6-8 brasses · 200 souple.`;break;
  case 'ow':t='Eau libre (lac / océan)';x=`Combinaison. 10' souple puis 4×(5' à {CSSim} + 1' plus vite), visée toutes les 6 brasses, départs plage. Jamais seul : en club ou en zone surveillée. Si l'eau est trop froide (< 16 °C), fais-le en piscine.`;break;
  case 'recup':t='Natation récup';x=`${m} m souple : 4×(200 crawl + 50 dos) + éducatifs au choix.`;break;
 }
 return {sp:'swim',t,m,x,kind};
}
function bikeS(kind,min,extra){
 min=Math.max(30,Math.round(min/5)*5);const H=hm(min)+' (≈ {bk'+min+'} km)';let t,x;
 switch(kind){
  case 'z2':t='Vélo endurance';x=`${H} en {Z2}, cadence 85-95 rpm.`+(min<=75?" Débuts en vélo : parcours plat, apprends à boire et manger en roulant, kit de réparation (chambre à air, démonte-pneus, pompe) toujours sur toi.":'');break;
  case 'tempo':t='Vélo tempo';x=`${H} : 20' en {Z2} puis 3×12' en {Z3} r5', reste en {Z2}.`;break;
  case 'ss':t='Vélo sweet spot';x=`${H} : 20' d'échauf. puis 3×15' en {SS} r5', reste en {Z2}. Home-trainer possible.`;break;
  case 'force':t='Vélo force';x=`${H} : 20' d'échauf. puis 6×5' en côte à 55-65 rpm en {Z3}, récup en descente, reste en {Z2}. Les coteaux autour de Tarbes sont parfaits.`;break;
  case 'seuil':t='Vélo seuil';x=`${H} : 20' d'échauf. puis 4×8' en {Z4} r4', reste en {Z2}.`;break;
  case 'im':t='Sortie longue allure Ironman';x=`${H} dont ${min>=240?"3×40'":"2×30'"} en {ZIM}, reste en {Z2}. Nutrition de course : 70-90 g de glucides/h, 600-800 ml/h.`;break;
  case 'easy':t='Vélo souple';x=`${H} en {Z1}, jambes qui tournent.`;break;
 }
 if(min>=90&&kind!=='im')x+=' Mange 40-60 g de glucides/h.';
 return {sp:'bike',t,min,x:x+(extra||''),kind};
}

const SPCOL={run:'var(--run)',swim:'var(--swim)',bike:'var(--bike)',gym:'var(--gym)',race:'var(--race)',test:'var(--test)',multi:'var(--race)'};
function vCal(){
 const t=today();let h=icsCard()+`<div class="card"><div class="legend"><span><i style="background:var(--run)"></i>Course</span><span><i style="background:var(--swim)"></i>Natation</span><span><i style="background:var(--bike)"></i>Vélo</span><span><i style="background:var(--gym)"></i>Salle</span><span><i style="background:var(--race)"></i>Course objectif</span><span><i style="background:var(--test)"></i>Test</span><span><i style="background:#241f13;border:1px solid #d9a54a"></i>Semaine école</span></div><p class="note" style="margin:8px 0 0">Touche un jour pour voir le détail. Chiffre vert : tout est coché.</p></div>`;
 for(let m=new Date(2026,9,1,12);m<=RACE;m=new Date(m.getFullYear(),m.getMonth()+1,1,12)){
  const y=m.getFullYear(),mo=m.getMonth(),first=(m.getDay()+6)%7,nd=new Date(y,mo+1,0).getDate();
  const MO=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  h+=`<div class="month" id="m-${y}-${mo}"><h2>${MO[mo]} ${y}</h2><div class="cgrid">${['L','M','M','J','V','S','D'].map(x=>`<div class="wd">${x}</div>`).join('')}`;
  for(let i=0;i<first;i++)h+='<div></div>';
  for(let dd=1;dd<=nd;dd++){
   const d=new Date(y,mo,dd,12),p=PLAN[key(d)];
   if(!p){h+=`<div class="cday past"><span class="n">${dd}</span></div>`;continue;}
   const sps=[];p.ses.forEach(s=>{if(s.sp!=='rest'&&!sps.includes(s.sp))sps.push(s.sp);});
   const race=p.ses.some(s=>s.sp==='race');
   const todo=p.ses.map((s,i)=>s.sp==='rest'?null:i).filter(i=>i!==null),ok=todo.length&&todo.every(i=>ST.done[key(d)+'-'+i]);
   const cls=['cday',p.S&&!race?'sc':'',race?'race':'',key(d)===key(t)?'tdy':'',d<t&&key(d)!==key(t)?'past':'',ok?'ok':''].join(' ');
   h+=`<div class="${cls}" data-act="day" data-d="${key(d)}"><span class="n">${dd}</span><div class="dots">${sps.map(x=>`<i style="background:${SPCOL[x]}"></i>`).join('')}</div></div>`;
  }
  h+='</div></div>';
 }
 return h;
}

const RACEDIST=t=>/Marathon des Landes|^Marathon/.test(t)?42195:/Semi/.test(t)?21097.5:/10 km/.test(t)?10000:0;
function goalSec(g){g=String(g||'').replace(/[<> ]/g,'');const h=g.match(/^(\d+)h(\d{1,2})?$/i);if(h)return (+h[1])*3600+(+(h[2]||0))*60;const s=parseTime(g);return s>0?s:NaN;}
function sesKind(s){
 const sp=s.sp==='race'||s.sp==='test'?(s.ev?s.ev.sp:''):s.sp;
 if(sp==='run'){const t=s.t;
  if(s.sp==='race')return RACEDIST(t)?{sp:'run',k:'race'}:null;
  if(/Test seuil/.test(t))return {sp:'run',k:'seuil',thr:1};
  if(s.sp==='test')return null;
  if(/Sortie longue/.test(t))return {sp:'run',k:'long'};
  if(/Seuil|Tempo|Allure semi|Allure marathon|Rappel/.test(t))return {sp:'run',k:'seuil'};
  if(/VMA|Allure 10|Fartlek|Côtes/.test(t))return {sp:'run',k:'vma'};
  return {sp:'run',k:'ef'};}
 if(sp==='bike'&&s.sp==='bike')return {sp:'bike',k:/Sortie longue|endurance|souple/i.test(s.t)?'long':'int'};
 if(sp==='swim'&&s.sp==='swim')return {sp:'swim',k:'swim'};
 return null;}
// valeur prévue : s/km (course), km/h (vélo), s/100 m (natation)
function plannedVal(s,d,kd){const {p,c}=ctx(d),t=s.t;
 if(kd.sp==='run'){
  if(s.sp==='race'){const dist=RACEDIST(t),g=goalSec(s.ev.goal);return g&&dist?g/(dist/1000):p.T;}
  if(kd.thr)return p.T;
  if(/Sortie longue|Endurance|Footing|Vitesse légère|Veille|Activation/.test(t))return (p.E[0]+p.E[1])/2;
  if(/Allure Ironman|Enchaînement/.test(t))return p.IM;
  if(/Allure marathon|Rappel/.test(t))return p.M;
  if(/Allure semi/.test(t))return p.S;
  if(/Allure 10/.test(t))return p.K10;
  if(/30\/30|Fartlek/.test(t))return p.V;
  if(/VMA courte/.test(t))return p.R;
  if(/VMA/.test(t))return p.I;
  if(/Seuil|Tempo/.test(t))return p.T;
  return (p.E[0]+p.E[1])/2;}
 if(kd.sp==='bike'){const v=interp([['2026-10-20',24],['2027-06-01',27],['2028-06-18',30]],d);return /souple/.test(t)?v-3:/Sortie longue allure/.test(t)?v+1:v;}
 if(kd.sp==='swim'){if(/CSS/.test(t))return c;if(/vitesse/.test(t))return c-4;if(/Ironman|Eau libre/.test(t))return c+6;if(/récup/.test(t))return c+15;return c+8;}
}
function spdLabel(kd,s){
 if(kd.sp==='bike')return 'Vitesse moyenne';
 if(kd.sp==='swim')return /CSS|vitesse/.test(s.t)?'Allure des séries':'Allure moyenne';
 if(kd.k==='race')return 'Allure moyenne de course';
 if(kd.thr)return 'Allure des 20 dernières min';
 return kd.k==='long'||kd.k==='ef'?'Allure moyenne':'Allure des fractions';}
function opt(a,b,step,sel,fmt){let h='';for(let v=a;v<=b+1e-9;v=Math.round((v+step)*10)/10)h+=`<option value="${v}" ${Math.abs(v-sel)<1e-6?'selected':''}>${fmt?fmt(v):v}</option>`;return h;}
function spdHtml(s,d,id){

  pick=`<select data-log="${id}" data-part="a">${kd.sp==='swim'?opt(1,3,1,mn):opt(3,8,1,mn)}</select><span>:</span><select data-log="${id}" data-part="b">${opt(0,59,1,sc,two)}</select><span>${kd.sp==='swim'?'/100 m':'/km'}</span>`;}

function lineChart(o){
 const id='ch'+(CHN++),W=chartW(),H=o.h||210,P={l:46,r:12,t:12,b:26},TK=o.tick||o.fmt;
 const all=o.series.flatMap(s=>s.pts);

 let x0=o.x0||Math.min(...all.map(p=>+p.x)),x1=o.x1||Math.max(...all.map(p=>+p.x));if(x1-x0<7*DAY){x0-=4*DAY;x1+=4*DAY;}
 const ys=all.map(p=>p.y).concat(o.goal?[o.goal.y]:[]);let y0=Math.min(...ys),y1=Math.max(...ys);const pad=(y1-y0||Math.abs(y1)*.1||1)*.12;y0-=pad;y1+=pad;if(o.zero)y0=0;
 P.l=Math.max(30,12+6.5*Math.max(...[0,1,2,3].map(i=>String(TK(y0+(y1-y0)*i/3)).length)));
 const X=x=>P.l+(+x-x0)/(x1-x0)*(W-P.l-P.r),Y=y=>o.invert?P.t+(y-y0)/(y1-y0)*(H-P.t-P.b):H-P.b-(y-y0)/(y1-y0)*(H-P.t-P.b);
 let g='';
 for(let i=0;i<=3;i++){const yv=y0+(y1-y0)*i/3;g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(yv)}" y2="${Y(yv)}" stroke="var(--line)" stroke-width="1"/><text x="${P.l-6}" y="${Y(yv)+4}" text-anchor="end" class="ax">${TK(yv)}</text>`;}
 // repères de mois
 const months=[];for(let m=new Date(new Date(x0).getFullYear(),new Date(x0).getMonth()+1,1,12);+m<=x1;m=new Date(m.getFullYear(),m.getMonth()+1,1,12))months.push(m);
 const stepM=Math.max(1,Math.ceil(months.length/((W-60)/56)));
 months.forEach((m,i)=>{if(i%stepM)return;g+=`<text x="${X(m)}" y="${H-8}" text-anchor="middle" class="ax">${MOIS[m.getMonth()]}${m.getMonth()===0||i===0?' '+String(m.getFullYear()).slice(2):''}</text>`;});
 if(o.goal)g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(o.goal.y)}" y2="${Y(o.goal.y)}" stroke="var(--race)" stroke-width="1.5" stroke-dasharray="2 4"/><text x="${W-P.r}" y="${Y(o.goal.y)-5}" text-anchor="end" class="ax" style="fill:var(--race)">${esc(o.goal.label)}</text>`;

  if(s.bars){const bw=Math.max(3,Math.min(14,(W-P.l-P.r)/Math.max(8,pts.length)*.6));pts.forEach(p=>{const yb=Y(Math.max(y0,0)),yt=Y(p.y);g+=`<rect x="${X(p.x)-bw/2}" y="${Math.min(yb,yt)}" width="${bw}" height="${Math.max(1,Math.abs(yb-yt))}" rx="2" fill="${s.color}"/>`;});return;}

  if(!s.dash)pts.forEach(p=>g+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="4" fill="${s.color}" stroke="var(--card)" stroke-width="2"/>`);});
 g+=`<line class="xh" x1="0" x2="0" y1="${P.t}" y2="${H-P.b}" stroke="var(--mut)" stroke-width="1" style="display:none"/><rect x="${P.l}" y="0" width="${W-P.l-P.r}" height="${H}" fill="transparent" data-ch="${id}"/>`;
 CH[id]={o,X,W};
 const leg=o.series.length>1?`<div class="legend" style="margin-bottom:6px">${o.series.map(s=>`<span><svg width="18" height="8"><line x1="0" x2="18" y1="4" y2="4" stroke="${s.color}" stroke-width="${s.bars?6:2}" ${s.dash?'stroke-dasharray="4 3"':''}/></svg>${esc(s.name)}</span>`).join('')}</div>`:'';
 const rows=[];const xs=[...new Set(all.map(p=>key(new Date(+p.x))))].sort();

function chartHover(e){

const UNITS={kmh:'km/h',pace:'min/km',p100:'min/100 m'};
function toKmh(val,unit){if(unit==='kmh')return +String(val).replace(',','.');const s=parseTime(val);if(!(s>0))return NaN;return unit==='pace'?3600/s:360/s;}
function fromKmh(v,unit){return unit==='kmh'?(Math.round(v*10)/10).toString().replace('.',','):mss(unit==='pace'?3600/v:360/v);}
const EFF=[null,{n:'Récupération',cho:.4},{n:'Endurance',cho:.55},{n:'Tempo / allure marathon',cho:.7},{n:'Seuil / allure semi-10 km',cho:.85},{n:'VMA / très intense',cho:.95}];
function nutriCalc(){
 const W=ST.weight||76,sp=NC.sp,v=toKmh(NC.speed,NC.unit);
 const distKm=sp==='swim'?(+NC.dist)/1000:+NC.dist,dplus=sp==='swim'?0:Math.max(0,+NC.dplus||0),T=(distKm/v)*60; // minutes
 if(!(T>0)||!isFinite(T))return null;
 const d=clampDay(today()),{p,c}=ctx(d);let level,info,kcal,watts=null;
 if(sp==='run'){const veq=(distKm+dplus/100)/(T/60),r=(3600/p.T)/veq; // >1 = plus lent que le seuil
  level=r>1.30?1:r>1.12?2:r>1.04?3:r>0.97?4:5;info=`Allure équivalente plat ${mss(3600/veq)}/km · ton seuil ${mss(p.T)}/km`;
  kcal=W*(1.03*distKm+0.0085*dplus);}
 else if(sp==='bike'){const m=W+9,vs=v/3.6,Pr=(9.81*m*0.005*vs+0.5*1.2*0.32*vs*vs*vs)/0.97,Pc=9.81*m*dplus/(T*60)/0.97;watts=Pr+Pc;
  const ftp=ST.ftp||Math.round(2.9*W),r=watts/ftp;level=r<.55?1:r<.75?2:r<.88?3:r<1.02?4:5;
  info=`Puissance estimée ≈ ${Math.round(watts)} W (${Math.round(r*100)} % de ${ST.ftp?'ta FTP':'ta FTP estimée, '+ftp+' W'})`;
  kcal=watts*T*60/1000/(4.184*0.235);}
 else{const pace=360/v,r=pace/c;level=r>1.15?1:r>1.06?2:r>1.02?3:r>0.97?4:5;info=`Allure ${mss(pace)}/100 m · ta CSS ${mss(c)}/100 m`;
  kcal=[0,6,7.5,9,10.5,12][level]*W*T/60;}
 if(NC.eff!=='auto')level=+NC.eff;
 const cho=kcal*EFF[level].cho/4;

function fuelPlan(R){

 else if(T<75){rate=race&&level>=4?15:0;note=race&&level>=4?'Rince-bouche ou quelques gorgées de boisson sucrée : l\'effet passe par le cerveau, pas par l\'énergie.':'Eau seule : le glycogène suffit.';}

 else{rate=sp==='bike'?(race?85:70):(race?70:60);if(T>=300&&sp==='run')rate=60;}
 const mtc=rate>60; // glucose + fructose
 // boisson & sodium
 let fluid=sp==='swim'?0:temp<10?400:temp<20?500:temp<25?650:750;if(sp==='bike')fluid+=100;if(T<60&&!warm)fluid=T>=40?250:0;
 const sweat=Math.max(.3,Math.min(2,(sp==='swim'?.35:.55)+.12*(level-1)+.035*(temp-15)))*(sp==='bike'?.9:1);
 const sodium=(T>=90||hot)&&sp!=='swim'?(hot?800:500):(T>=60&&warm?300:0);
 const lossL=sweat*T/60-fluid*T/60/1000,lossPct=lossL/W*100;
 // timeline
 const items=[],speedKmMin=R.distKm/T,kmAt=t=>sp==='swim'?'':(Math.round(t*speedKmMin*10)/10).toString().replace('.',',')+' km';
 const caf=NC.caf&&(race||level>=4)&&T>=45&&sp!=='swim'?Math.round(3*W/10)*10:0;
 if(rate>0){
  const first=sp==='bike'?20:race&&T<150?30:25,stop=T-(sp==='run'?20:25);
  let gel=sp==='run'?(rate>=60?30:25):25,iv=Math.round(gel*60/rate/5)*5;if(sp==='bike')iv=20;iv=Math.max(15,Math.min(45,iv));
  let n=0,tt=first;const cafAt=caf&&T>=120?Math.round(T*0.6/iv)*iv:null;
  while(tt<=stop){const g=sp==='bike'?Math.round(rate*iv/60):gel;let what;
   if(sp==='bike')what=tt<T*0.55?(g>=35?'1 barre énergétique (40 g) ou 2 petites crêpes/riz au lait':'½ barre ou 1 banane'):(g>=35?'1 gel 40 g ou 1 gel 25 g + gorgées de boisson':'1 gel 25 g');
   else what=gel>=30?'1 gel 30 g':'1 gel 25 g';
   if(cafAt&&Math.abs(tt-cafAt)<iv/2)what+=' caféiné (≈ 75-100 mg)';
   items.push({t:tt,km:kmAt(tt),what,g,ml:Math.round(fluid*iv/60/10)*10});n++;tt+=iv;}
 }
 const tot=items.reduce((a,b)=>a+b.g,0)+(sp==='bike'&&rate>0?0:0);
 // avant / après
 const pre=[];
 if(race&&T>=90)pre.push(['J-2 et J-1','Recharge en glucides : 8-10 g/kg/jour ≈ '+Math.round(8*W)+'-'+Math.round(10*W)+' g/jour (pâtes, riz, pain blanc, jus, compotes), peu de fibres et de gras.']);
 else if(race&&T>=60)pre.push(['La veille','Dîner riche en glucides ≈ 2 g/kg ('+Math.round(2*W)+' g), habituel, pas d\'excès.']);
 if(T>=60||race)pre.push(['3 h avant','Repas : '+(race?'2-3':'1-2')+' g/kg de glucides ≈ '+Math.round((race?2:1)*W)+'-'+Math.round((race?3:2)*W)+' g (pain blanc + confiture/miel, banane, riz, compote), peu de fibres, 500 ml d\'eau.']);
 else pre.push(['1-2 h avant','Collation légère si tu as faim (banane, tartine), sinon rien. Effort court : pas besoin de « charger ».']);
 if(caf)pre.push(['60 min avant','Caféine : 3 mg/kg ≈ '+caf+' mg (2 expressos, ou gélule/gel caféiné).'+(T>=120?' Tu peux garder 1 mg/kg pour le dernier tiers.':'')+' Teste-la d\'abord à l\'entraînement ; évite après 16 h si tu t\'entraînes le soir.']);
 if(sp!=='swim'&&(T>=75||race))pre.push(['15 min avant','1 gel 25 g ou quelques gorgées de boisson sucrée'+(race&&T<45?' (facultatif sur effort court)':'')+' + 150-250 ml d\'eau.']);
 if(sp==='swim'&&T>=40)pre.push(['15 min avant','1 gel 25 g + quelques gorgées d\'eau : aucune prise possible ensuite en piscine.']);
 const post=[];
 const big=T>=90||level>=4;
 post.push(['0-30 min',big?`Glucides 1-1,2 g/kg ≈ ${Math.round(W)}-${Math.round(1.2*W)} g + protéines ≈ ${Math.round(.3*W)} g (ex. 500 ml de lait chocolaté + 1 banane + 1 barre).`:`Un vrai repas dans les 2 h suffit, avec ≈ ${Math.round(.3*W)} g de protéines.`]);

function moveMissed(){
 if(NOMOVE)return;
 // une séance clé (VMA/seuil) non faite hier ou avant-hier est replacée sur le prochain jour libre de la semaine
 const t=today(),sun=add(monday(t),6);if(t<START)return;
 for(let back=2;back>=1;back--){
  const d=add(t,-back);if(monday(d)<monday(t))continue;const k=key(d),p=PLAN[k];if(!p||offInfo(d))continue;
  p.ses.forEach((s,i)=>{
   if(s.sp!=='run'||!s.q||s.ev||s.t==='Sortie longue'||s.moved||s.adj||ST.done[k+'-'+i]||(ST.log||{})[k+'-'+i])return;
   if(!HARD.test(s.t))return;
   if(Object.values(ST.extra||{}).some(a=>a.date===k&&a.sp==='run'))return;
   let placed=0;
   for(let dd=t;dd<=sun;dd=add(dd,1)){
    const kk=key(dd),q=PLAN[kk],nx=PLAN[key(add(dd,1))];if(!q)continue;
    if(q.ses.some(z=>z.sp==='race'||z.ev||z.t==='Veille de course'||(z.sp==='run'&&(z.q||z.t==='Sortie longue'))))continue;
    const pv=PLAN[key(add(dd,-1))];
    if(nx&&nx.ses.some(z=>z.sp==='race'||z.t==='Sortie longue'||z.ev))continue;
    if(pv&&pv.ses.some(z=>z.sp==='race'||z.t==='Sortie longue'))continue;
    const j=q.ses.findIndex(z=>z.sp==='run');
    const mv={...s,moved:k,x:`↪︎ Déplacée du ${fd(d,{day:1})} (non faite). `+s.x};
    if(j>=0)q.ses[j]=mv;else q.ses.unshift(mv);
    p.ses[i]={sp:'rest',t:s.t+' → déplacée',x:`Séance non remontée de ta montre : replacée le ${fd(dd,{day:1})}.`,moved:k,ghost:1};
    placed=1;break;}
   if(!placed)p.ses[i]={sp:'rest',t:s.t+' → non rattrapée',x:'Séance non remontée de ta montre. Pas de place cette semaine sans empiler deux séances dures : on ne la rattrape pas, c\'est mieux que de se cramer.',moved:k,ghost:1};
  });}}

function workPace(a,target){

 const wk=laps.filter(l=>l.work);if(wk.reduce((x,l)=>x+l.time,0)>=120)return wk.reduce((x,l)=>x+l.time,0)/wk.reduce((x,l)=>x+l.dist,0)*1000;

 if(t>=180)return w.reduce((x,l)=>x+l.time,0)/w.reduce((x,l)=>x+l.dist,0)*1000;

  const sp=STRAVA_SP[a.type];if(!sp||!(a.dist>0)||!(a.time>0))return;

   const prev=Object.entries(ST.log).find(([id,l])=>l.sid===a.id);if(prev)idx=+prev[0].slice(11);

  if(idx<0){if(!ST.extra[a.id])x++;ST.extra[a.id]={date:k,sp,name:a.name,dist:a.dist,time:a.time,hr:a.hr,dplus:a.dplus};return;}
